<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-chat">
        <header class="header-chat">
            <h1>✨ chatbot ✨</h1>
            <p>Tu asistente de Moda & Tendencias</p>
        </header>

        <!-- Zona de mensajes según boceto -->
        <main class="zona de mensajes" id="zona-de-mensajes" aria-live="polite">
            <!-- Los mensajes del bot y usuario se agregan dinámicamente -->
        </main>

        <!-- Ingreso de mensajes según boceto -->
        <footer class="ingreso de mensajes" id="ingreso-de-mensajes">
            <!-- Los botones de opciones o inputs se cargan dinámicamente -->
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
